<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}동영상 분석 시스템{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            padding-top: 60px;
        }
        .video-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        /* 브레드크럼 스타일 */
        .custom-breadcrumb-item {
            display: inline-block;
            position: relative;
            padding: 0.5rem 1rem;
        }

        /* 활성화된 단계 (현재 페이지) */
        .custom-breadcrumb-item.active a {
            color: #0d6efd;
            font-weight: bold;
            background-color: #e7f1ff;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
        }

        /* 완료된 단계 (클릭 가능) */
        .custom-breadcrumb-item:not(.active):not(.disabled) a {
            color: #198754;
            text-decoration: none;
            transition: all 0.2s;
        }

        .custom-breadcrumb-item:not(.active):not(.disabled) a:hover {
            color: #0a58ca;
            text-decoration: underline;
        }

        /* 비활성화된 단계 (아직 안 감) */
        .custom-breadcrumb-item.disabled span {
            color: #adb5bd;
            cursor: not-allowed;
        }

        /* 화살표 추가 */
        .custom-breadcrumb-item:not(:last-child)::after {
            content: '›';
            margin-left: 0.5rem;
            color: #6c757d;
        }

        /* 반응형 - 작은 화면에서는 세로 정렬 */
        @media (max-width: 768px) {
            .custom-breadcrumb-item {
                display: block;
                padding: 0.25rem 0.5rem;
            }
            
            .custom-breadcrumb-item:not(:last-child)::after {
                content: '↓';
                display: block;
                margin-left: 0;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'media_list' %}">
                <i class="bi bi-grid-1x2-fill"></i> 동영상 분석 시스템
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- 미디어 목록 -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'media_list' %}">
                            <i class="bi bi-collection-play"></i> 미디어 목록
                        </a>
                    </li>
                    
                    <!-- 모델 허브 -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'modelhub:model_list' %}">
                            <i class="bi bi-box-seam"></i> 모델 허브
                        </a>
                    </li>
                    
                    <!-- 탐지 작업 -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'vision_engine:detection_list' %}">
                            <i class="bi bi-search"></i> 탐지 작업
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Breadcrumb Block -->
        {% block breadcrumb %}
        <div class="row">
            <div class="col-md-12">
                <div class="breadcrumb-container">
                    <nav aria-label="breadcrumb">
                        <ol class="custom-breadcrumb">
                            <!-- 홈 (항상 표시) -->
                            <li class="custom-breadcrumb-item">
                                <a href="{% url 'media_list' %}">
                                    <i class="bi bi-collection-play"></i> 미디어 목록
                                </a>
                            </li>
                            
                            <!-- 추가 항목 (각 페이지에서 정의) -->
                            {% block breadcrumb_items %}{% endblock %}
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
        {% endblock breadcrumb %}

        <!-- 메인 컨텐츠 -->
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
